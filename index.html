<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #444;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #007acc;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-grow: 1;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: 2px solid #007acc;
        }

        button {
            padding: 10px 20px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #005a9e;
        }

        .iframe-container {
            flex-grow: 1;
            position: relative;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #333;
            display: none;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔒 Proxy</h1>
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Enter URL or search term...">
            <button id="goBtn">Go</button>
        </div>
    </div>

    <div class="iframe-container">
        <div id="loading" class="loading">Loading...</div>
        <!-- 
            The iframe src is set via JS. 
            We use a relative path '/URL' so the browser sends requests to our Python server.
        -->
        <iframe id="contentFrame"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('contentFrame');
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const loading = document.getElementById('loading');

        // Default to Google
        urlInput.value = "https://www.google.com";

        function navigate(url) {
            if (!url) return;
            
            // If it's a search term, send it to Google
            if (!url.includes('.')) {
                url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            urlInput.value = url;
            loading.style.display = 'block';
            
            // Key: We prepend '/' to the URL.
            // This makes the browser send a request to: http://127.0.0.1:8080/https://google.com
            // Our Python server will strip the '/' and fetch 'https://google.com'
            // Then it will rewrite the links so they also go to '/https://...'
            iframe.src = `/${url}`;
        }

        goBtn.addEventListener('click', () => navigate(urlInput.value));
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate(urlInput.value);
        });

        iframe.addEventListener('load', () => {
            loading.style.display = 'none';
        });

        // Initial Load
        navigate(urlInput.value);
    </script>

</body>
</html>
