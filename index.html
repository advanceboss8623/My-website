<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Bypass</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        main { border: 1px solid #ccc; padding: 10px; min-height: 200px; }
        #proxyBtn { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>School Proxy Bypass</h1>
    <button id="proxyBtn">🌐 Proxy: OFF</button>
    
    <form>
        <input type="text" name="q" placeholder="Search Google..." />
        <button type="submit">Search</button>
    </form>
    
    <main>
        <p>Content will load here when proxy is ON.</p>
    </main>

    <a href="https://www.reddit.com">Visit Reddit</a>
    <a href="https://www.wikipedia.org">Visit Wikipedia</a>

    <script src="script.js"></script>
</body>
</html>
