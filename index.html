<!DOCTYPE html>
<html>
<head>
    <title>My Chrome</title>        
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #202124;
        }

        .tabs {
            height: 40px;
            background: #dee1e6;
            display: flex;
            align-items: center;
            padding: 5px;
        }

        .tab {
            background: white;
            padding: 9px 25px;
            border-radius: 10px 10px 0 0;
            font-size: 14px;
        }

        .tabs button {
            border: none;
            background: transparent;
            font-size: 24px;
            margin-left: 8px;
        }

        .toolbar {
            height: 52px;
            background: #fff;
            display: flex; /* Fixed the typo here */
        }
    </style>
    <!-- Keep this line only if you also have an external style.css file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="tabs">
        <div class="tab">🌐 New Tab</div>
        <button>+</button>
    </div>

    <div class="toolbar">
        <button>←</button>
        <button>→</button>
        <button onclick="location.reload()">↻</button>

        <form action="https://www.google.com/search" method="GET">
            <input
                name="q"
                placeholder="Search Google or enter a URL"
                autofocus
            >
        </form>

        <button>⋮</button>
    </div>

    <main>

        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form class="search-box" action="https://www.google.com/search" method="GET">
            <span>⌕</span>
            <input
                name="q"
                placeholder="Search Google"
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>

        <div class="shortcuts">
            <a href="https://www.youtube.com">▶ YouTube</a>
            <a href="https://www.wikipedia.org">W Wikipedia</a>
            <a href="https://github.com">◆ GitHub</a>
        </div>

    </main>

</body>
</html>
