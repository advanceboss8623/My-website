<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 18px;
        }

        /* Proxy Toggle Button */
        #proxyToggle {
            background-color: #d32f2f; /* Red for OFF */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #proxyToggle.active {
            background-color: #388e3c; /* Green for ON */
        }

        /* Search Bar */
        .search-container {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #ccc;
        }

        #urlInput {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #goBtn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #goBtn:hover {
            background-color: #1565c0;
        }

        /* Iframe Container */
        .iframe-container {
            flex-grow: 1;
            position: relative;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Indicator */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #333;
            display: none;
            z-index: 1001;
            background: rgba(255,255,255,0.8);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>🌐 Proxy Master</h1>
        <button id="proxyToggle">Proxy: OFF</button>
    </div>

    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Enter URL or search term...">
        <button id="goBtn">Go</button>
    </div>

    <div class="iframe-container">
        <div id="loading">Loading...</div>
        <iframe id="contentFrame" src="about:blank"></iframe>
    </div>

    <script>
        const proxyToggle = document.getElementById('proxyToggle');
        const iframe = document.getElementById('contentFrame');
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const loading = document.getElementById('loading');

        let isProxyOn = false;
        let currentUrl = "";

        // 1. Toggle Proxy
        proxyToggle.addEventListener('click', () => {
            isProxyOn = !isProxyOn;
            if (isProxyOn) {
                proxyToggle.innerText = "Proxy: ON";
                proxyToggle.classList.add('active');
            } else {
                proxyToggle.innerText = "Proxy: OFF";
                proxyToggle.classList.remove('active');
            }
        });

        // 2. Handle Go/Search
        function navigate(url) {
            // Clean URL
            if (!url) return;
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            urlInput.value = url;
            currentUrl = url;

            // Show loading
            loading.style.display = 'block';

            let targetUrl = url;
            let proxyUrl = "";

            if (isProxyOn) {
                // Use a robust proxy that supports iframe embedding
                // 'https://corsproxy.io/?' is good, but 'https://api.allorigins.win/' is better for raw HTML
                // However, for full navigation, we need a service that returns the full page.
                // We'll use 'https://corsproxy.io/?' as it's generally more reliable for iframes.
                proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            } else {
                proxyUrl = url;
            }

            iframe.src = proxyUrl;
        }

        goBtn.addEventListener('click', () => navigate(urlInput.value));
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate(urlInput.value);
        });

        // 3. Handle Link Rewriting (The "Perfect" Part)
        // Since we are in an iframe, we can't directly access its document easily due to CORS.
        // So we will use a 'postMessage' approach or simply reload the iframe with the new URL.
        
        iframe.addEventListener('load', () => {
            loading.style.display = 'none';
            
            if (!isProxyOn) return; // No need to rewrite if proxy is off

            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const links = iframeDoc.querySelectorAll('a');
                
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
                        // Prevent default behavior
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            let newUrl = href;
                            // Handle relative URLs
                            if (newUrl.startsWith('/')) {
                                const urlObj = new URL(currentUrl);
                                newUrl = `${urlObj.protocol}//${urlObj.host}${newUrl}`;
                            }
                            navigate(newUrl);
                        });
                    }
                });
            } catch (err) {
                // CORS might block access to iframe doc if the proxy doesn't send correct headers
                console.log("Could not rewrite links directly, clicking will reload with new URL.");
            }
        });

        // Initial Load
        navigate("https://www.google.com");
    </script>

</body>
</html>
