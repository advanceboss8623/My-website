<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Bypass Proxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        
        /* Navigation Bar */
        nav {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 { margin: 0; font-size: 20px; }

        /* Proxy Toggle Button */
        #proxyToggle {
            background-color: #ff4444; /* Red when OFF */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #proxyToggle.active {
            background-color: #44ff44; /* Green when ON */
        }

        /* Search Bar */
        .search-container {
            padding: 20px;
            text-align: center;
        }

        .search-container input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        .search-container button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Main Content Area */
        main {
            padding: 20px;
            min-height: 400px;
        }

        /* Iframe to display proxied content */
        #contentFrame {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            background: white;
        }
        
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <nav>
        <h1>Proxy Browser</h1>
        <!-- The Button that actually works -->
        <button id="proxyToggle">Proxy: OFF</button>
    </nav>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter URL or Search Query...">
        <button onclick="handleSearch()">Go</button>
    </div>

    <div class="status" id="statusMsg">Status: Direct Connection</div>

    <main>
        <!-- This iframe will display the proxied website -->
        <iframe id="contentFrame" src="about:blank"></iframe>
    </main>

    <script>
        const proxyToggle = document.getElementById('proxyToggle');
        const iframe = document.getElementById('contentFrame');
        const statusMsg = document.getElementById('statusMsg');
        
        let isProxyOn = false;

        // 1. Toggle the Proxy Button
        proxyToggle.addEventListener('click', () => {
            isProxyOn = !isProxyOn;
            
            if (isProxyOn) {
                proxyToggle.innerText = "Proxy: ON";
                proxyToggle.classList.add('active');
                statusMsg.innerText = "Status: Proxy Active (Bypassing Blocks)";
                statusMsg.style.color = "green";
            } else {
                proxyToggle.innerText = "Proxy: OFF";
                proxyToggle.classList.remove('active');
                statusMsg.innerText = "Status: Direct Connection";
                statusMsg.style.color = "#666";
            }
        });

        // 2. Handle Search / URL Entry
        function handleSearch() {
            const input = document.getElementById('searchInput').value;
            if (!input) return;

            let targetUrl = input;
            let proxyUrl = "";

            // If it looks like a search query, send to Google
            if (!input.includes('.') && !input.startsWith('http')) {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
            }

            // Ensure it has http/https
            if (!targetUrl.startsWith('http')) {
                targetUrl = 'https://' + targetUrl;
            }

            if (isProxyOn) {
                // Use a reliable public proxy that bypasses DNS and uBlock
                // We use 'corsproxy.io' or 'api.allorigins.win' depending on needs.
                // For full page rendering (including JS), an iframe proxy is best.
                
                // Method: Use a proxy service that returns the HTML
                // Note: Some sites block iframes. If that happens, use the fetch method below.
                
                proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                
                // Try loading via iframe first
                iframe.src = proxyUrl;
            } else {
                // Direct load
                iframe.src = targetUrl;
            }
        }

        // Optional: Handle Enter key in search box
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>

</body>
</html>
