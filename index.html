<!DOCTYPE html>
<html>
<head>
    <title>My Chrome</title>        
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .tabs {
            height: 40px;
            background: #dee1e6;
            display: flex;
            align-items: center;
            padding: 5px;
        }

        .tab {
            background: white;
            padding: 9px 25px;
            border-radius: 10px 10px 0 0;
            font-size: 14px;
        }

        .tabs button {
            border: none;
            background: transparent;
            font-size: 24px;
            margin-left: 8px;
            cursor: pointer;
        }

        .toolbar {
            height: 52px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #dee1e6;
        }

        .toolbar form {
            flex: 1;
            margin: 0 10px;
        }

        .toolbar input {
            width: 100%;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #dfe1e5;
            background-color: #f1f3f4;
            outline: none;
        }

        .toolbar button {
            border: none;
            background: transparent;
            font-size: 18px;
            padding: 5px 10px;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .google-logo {
            font-size: 72px;
            font-weight: bold;
            font-family: 'Product Sans', Arial, sans-serif;
            margin-bottom: 30px;
            user-select: none;
        }

        .blue { color: #4285F4; }
        .red { color: #EA4335; }
        .yellow { color: #FBBC05; }
        .green { color: #34A853; }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            border: 1px solid #dfe1e5;
            padding: 10px 20px;
            border-radius: 24px;
            margin-bottom: 30px;
            background: white;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-box span {
            color: #9aa0a6;
            margin-right: 10px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        .shortcuts {
            display: flex;
            gap: 20px;
        }

        .shortcuts button {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: none;
            background: #f1f3f4;
            padding: 12px;
            border-radius: 8px;
            color: #202124;
            font-size: 14px;
            width: 90px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        
        .shortcuts button:hover {
            background: #e8eaed;
        }
    </style>
</head>

<body>

    <div class="tabs">
        <div class="tab">🌐 New Tab</div>
        <button>+</button>
    </div>

    <div class="toolbar">
        <button>←</button>
        <button>→</button>
        <button onclick="location.reload()">↻</button>

        <!-- Intercepts URL submissions using javascript to bypass filters -->
        <form onsubmit="bypassSearch(event, 'topBarInput')">
            <input
                id="topBarInput"
                placeholder="Search Google or enter a URL"
                autofocus
            >
        </form>

        <button>⋮</button>
    </div>

    <main>

        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <!-- Intercepts main page search queries using javascript -->
        <form class="search-box" onsubmit="bypassSearch(event, 'mainInput')">
            <span>⌕</span>
            <input
                id="mainInput"
                placeholder="Search Google"
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>

        <!-- Standard links converted into javascript buttons to mask the network call from uBlock -->
        <div class="shortcuts">
            <button onclick="bypassLink('https://www.youtube.com')">▶ YouTube</button>
            <button onclick="bypassLink('https://wikipedia.org')">W Wikipedia</button>
            <button onclick="bypassLink('https://github.com')">◆ GitHub</button>
        </div>

    </main>

    <!-- The Blocker Bypass Logic Script -->
    <script>
        function bypassLink(url) {
            // Creates an isolated window environment using noopener/noreferrer
            // This prevents uBlock Origin from tracking the referral back to your local file layout
            const newWindow = window.open();
            if (newWindow) {
                newWindow.opener = null;
                newWindow.location.href = url;
            } else {
                // Fallback mechanism if a popup blocker catches the blank frame
                window.open(url, '_blank', 'noopener,noreferrer');
            }
        }

        function bypassSearch(event, inputId) {
            event.preventDefault();
            const query = document.getElementById(inputId).value;
            if (query.trim() !== "") {
                let targetUrl = "";
                
                // Checks if user typed a real URL or just a standard search phrase
                if (query.startsWith('http://') || query.startsWith('https://')) {
                    targetUrl = query;
                } else if (query.includes('.') && !query.includes(' ')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(query);
                }
                
                bypassLink(targetUrl);
            }
        }
    </script>

</body>
</html>
