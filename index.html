<!DOCTYPE html>
<html>
<head>
    <title>My Chrome</title>        
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .tabs {
            height: 40px;
            background: #dee1e6;
            display: flex;
            align-items: center;
            padding: 5px;
        }

        .tab {
            background: white;
            padding: 9px 25px;
            border-radius: 10px 10px 0 0;
            font-size: 14px;
        }

        .tabs button {
            border: none;
            background: transparent;
            font-size: 24px;
            margin-left: 8px;
            cursor: pointer;
        }

        .toolbar {
            height: 52px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #dee1e6;
        }

        .toolbar form {
            flex: 1;
            margin: 0 10px;
        }

        .toolbar input {
            width: 100%;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #ffebeb;
            background-color: #f1f3f4;
            outline: none;
        }

        .toolbar button {
            border: none;
            background: transparent;
            font-size: 18px;
            padding: 5px 10px;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .google-logo {
            font-size: 72px;
            font-weight: bold;
            font-family: 'Product Sans', Arial, sans-serif;
            margin-bottom: 30px;
        }

        .blue { color: #4285F4; }
        .red { color: #EA4335; }
        .yellow { color: #FBBC05; }
        .green { color: #34A853; }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            border: 1px solid #dfe1e5;
            padding: 10px 20px;
            border-radius: 24px;
            margin-bottom: 30px;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-box span {
            color: #9aa0a6;
            margin-right: 10px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .shortcuts {
            display: flex;
            gap: 20px;
        }

        .shortcuts a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #202124;
            font-size: 14px;
            width: 80px;
        }
    </style>
</head>

<body>

    <div class="tabs">
        <div class="tab">🌐 New Tab</div>
        <button>+</button>
    </div>

    <div class="toolbar">
        <button>←</button>
        <button>→</button>
        <button onclick="location.reload()">↻</button>

        <form action="https://www.google.com/search" method="GET">
            <input
                name="q"
                placeholder="Search Google or enter a URL"
                autofocus
            >
        </form>

        <button>⋮</button>
    </div>

    <main>

        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form class="search-box" action="https://www.google.com/search" method="GET">
            <span>⌕</span>
            <input
                name="q"
                placeholder="Search Google"
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>

        <div class="shortcuts">
            <a href="https://www.youtube.com">▶ YouTube</a>
            <a href="https://wikipedia.org">W Wikipedia</a>
            <a href="https://github.com">◆ GitHub</a>
        </div>

    </main>

</body>
</html>
