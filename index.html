<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #444;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #007acc;
            white-space: nowrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-grow: 1;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: 2px solid #007acc;
        }

        button {
            padding: 10px 20px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #005a9e;
        }

        .iframe-container {
            flex-grow: 1;
            position: relative;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #333;
            display: none;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            z-index: 100;
        }
        
        .status-bar {
            background-color: #2d2d2d;
            padding: 5px 20px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔒 Universal Proxy</h1>
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Enter URL or search term...">
            <button id="goBtn">Go</button>
        </div>
    </div>

    <div class="iframe-container">
        <div id="loading" class="loading">Loading...</div>
        <iframe id="contentFrame" allowfullscreen="true" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>
    
    <div class="status-bar">
        Proxy: 127.0.0.1:8080 | Notes: YouTube links are auto-converted to embeds.
    </div>

    <script>
        const iframe = document.getElementById('contentFrame');
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const loading = document.getElementById('loading');

        urlInput.value = "https://www.youtube.com";

        function navigate(url) {
            if (!url) return;
            
            // If it's a search term, send it to Google
            if (!url.includes('.')) {
                url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            // YouTube Embed Fix
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1].split('&')[0];
                url = `https://www.youtube.com/embed/${videoId}`;
            }

            urlInput.value = url;
            loading.style.display = 'block';
            
            // Prepend '/' to send request to our local proxy
            iframe.src = `/${url}`;
        }

        goBtn.addEventListener('click', () => navigate(urlInput.value));
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate(urlInput.value);
        });
    </script>
</body>
</html>
